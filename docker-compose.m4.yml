services:
  db:
    hostname: m4-db
    ports: !reset []
    environment:
      POSTGRES_DB: ${M4_DATABASE_NAME:?M4_DATABASE_NAME must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oa -d $$POSTGRES_DB"]
    networks:
      default:
        aliases: [m4-db]

  backend:
    image: oa-m4-resilience-backend:local
    volumes: !reset []
    environment:
      ENVIRONMENT: test
      AUTH_PROVIDER: mock
      AUTH_JWT_SECRET: ""
      AUTH_ALLOWED_ORIGINS: '["https://localhost"]'
      OA_PROVIDER: mock
      OA_BASE_URL: ""
      OA_API_KEY: ""
      LLM_PROVIDER: mock
      LLM_FALLBACK_PROVIDER: none
      DEEPSEEK_API_KEY: ""
      ARK_API_KEY: ""
      EMBEDDING_PROVIDER: mock
      EMBEDDING_API_KEY: ""
      SMTP_ENABLED: "false"
      SMTP_HOST: ""
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      WECOM_ENABLED: "false"
      WECOM_WEBHOOK_URL: ""
      CLAMD_HOST: ""
      DATABASE_URL: ${M4_DATABASE_URL:?M4_DATABASE_URL must be set}
      DATABASE_SYNC_URL: ${M4_DATABASE_SYNC_URL:?M4_DATABASE_SYNC_URL must be set}
      CHECKPOINTER_URL: ${M4_CHECKPOINTER_URL:?M4_CHECKPOINTER_URL must be set}

volumes:
  oa_pgdata:
    name: ${COMPOSE_PROJECT_NAME:?Compose project must be explicit}-pgdata

networks:
  default:
    internal: true
