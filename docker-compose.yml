# OA 智能体管理系统 MVP - 数据库与依赖编排
# 使用 pgvector 官方镜像（内置 vector 扩展），一键启动 PostgreSQL 16。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: oa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-oa_agent}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - oa_pgdata:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oa -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment: &oa_backend_environment
      ENVIRONMENT: ${ENVIRONMENT:-production}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-mock}
      AUTH_TENANT_ID: ${AUTH_TENANT_ID:-local}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-[]}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AI_ENABLED: ${AI_ENABLED:-true}
      OA_PROVIDER: ${OA_PROVIDER:-mock}
      OA_BASE_URL: ${OA_BASE_URL:-}
      OA_API_KEY: ${OA_API_KEY:-}
      OA_TIMEOUT_SECONDS: ${OA_TIMEOUT_SECONDS:-10}
      OA_READ_RETRIES: ${OA_READ_RETRIES:-2}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-ark}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-10}
      MEETING_LLM_TIMEOUT_SECONDS: ${MEETING_LLM_TIMEOUT_SECONDS:-45}
      TRTC_SDK_APP_ID: ${TRTC_SDK_APP_ID:-0}
      TRTC_SDK_SECRET_KEY: ${TRTC_SDK_SECRET_KEY:-}
      TRTC_USER_SIG_EXPIRE_SECONDS: ${TRTC_USER_SIG_EXPIRE_SECONDS:-3600}
      TRTC_ADMIN_USER_ID: ${TRTC_ADMIN_USER_ID:-administrator}
      MEETING_TRANSCRIPTION_ENABLED: ${MEETING_TRANSCRIPTION_ENABLED:-false}
      MEETING_TRANSCRIPTION_SECRET_ID: ${MEETING_TRANSCRIPTION_SECRET_ID:-}
      MEETING_TRANSCRIPTION_SECRET_KEY: ${MEETING_TRANSCRIPTION_SECRET_KEY:-}
      MEETING_TRANSCRIPTION_CALLBACK_KEY: ${MEETING_TRANSCRIPTION_CALLBACK_KEY:-}
      MEETING_TRANSCRIPTION_CALLBACK_URL: ${MEETING_TRANSCRIPTION_CALLBACK_URL:-}
      MEETING_TRANSCRIPTION_REGION: ${MEETING_TRANSCRIPTION_REGION:-ap-guangzhou}
      MEETING_TRANSCRIPTION_LANGUAGE: ${MEETING_TRANSCRIPTION_LANGUAGE:-bigmodel-zh}
      MEETING_TRANSCRIPTION_RETENTION_DAYS: ${MEETING_TRANSCRIPTION_RETENTION_DAYS:-30}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_CHAT_MODEL: ${DEEPSEEK_CHAT_MODEL:-deepseek-flash}
      ARK_BASE_URL: ${ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      ARK_API_KEY: ${ARK_API_KEY:-}
      ARK_CHAT_MODEL: ${ARK_CHAT_MODEL:-}
      ARK_THINKING_TYPE: ${ARK_THINKING_TYPE:-default}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-mock}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      ARK_EMBEDDING_MODEL: ${ARK_EMBEDDING_MODEL:-doubao-embedding-large}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      DATABASE_URL: postgresql+asyncpg://oa:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-oa_agent}
      DATABASE_SYNC_URL: postgresql+psycopg://oa:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-oa_agent}
      CHECKPOINTER_URL: postgresql://oa:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-oa_agent}
      ALLOW_TEST_DATABASE_RESET: "false"
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-15}
      NOTIFICATION_APP_URL: ${NOTIFICATION_APP_URL:-http://127.0.0.1:5173/oa/notifications}
      WECOM_ENABLED: ${WECOM_ENABLED:-false}
      WECOM_WEBHOOK_URL: ${WECOM_WEBHOOK_URL:-}
      WECOM_TENANT_ID: ${WECOM_TENANT_ID:-}
      WECOM_DEPARTMENT_ID: ${WECOM_DEPARTMENT_ID:-}
      WECOM_TIMEOUT_SECONDS: ${WECOM_TIMEOUT_SECONDS:-10}
      CLAMD_HOST: ${CLAMD_HOST:-}
      CLAMD_PORT: ${CLAMD_PORT:-3310}
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-10485760}
      ATTACHMENT_SCAN_TIMEOUT_SECONDS: ${ATTACHMENT_SCAN_TIMEOUT_SECONDS:-10}
      ATTACHMENT_STORAGE_DIR: /app/data/leave_attachments
      KNOWLEDGE_STORAGE_DIR: /app/data/knowledge_files
      OPS_STATE_DIR: /app/data/operations-monitor
      OPS_HEALTH_URL: http://backend:8001/healthz
      OPS_POLL_SECONDS: ${OPS_POLL_SECONDS:-60}
      OPS_PROBE_TIMEOUT_SECONDS: ${OPS_PROBE_TIMEOUT_SECONDS:-10}
      OPS_BACKLOG_AGE_SECONDS: ${OPS_BACKLOG_AGE_SECONDS:-120}
      OPS_BACKUP_MAX_AGE_HOURS: ${OPS_BACKUP_MAX_AGE_HOURS:-25}
      OPS_BACKUP_MAX_RUNTIME_SECONDS: ${OPS_BACKUP_MAX_RUNTIME_SECONDS:-3600}
      OPS_MODEL_PROBES_ENABLED: ${OPS_MODEL_PROBES_ENABLED:-false}
      OPS_ALERT_DELIVERY_ENABLED: ${OPS_ALERT_DELIVERY_ENABLED:-false}
      OPS_ALERT_EMAIL_TO: ${OPS_ALERT_EMAIL_TO:-}
      OPS_LOG_FILES: '${OPS_LOG_FILES:-[]}'
      OPS_LOG_KEYWORDS: '${OPS_LOG_KEYWORDS:-["ERROR","CRITICAL","Traceback"]}'
    volumes:
      - oa_files:/app/data
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  monitor:
    profiles: [monitoring]
    build:
      context: ./backend
    restart: unless-stopped
    command: [python, scripts/monitor_operations.py]
    environment:
      <<: *oa_backend_environment
    volumes:
      - oa_files:/app/data
    healthcheck:
      test: [CMD, python, -c, "import json,datetime; s=json.load(open('/app/data/operations-monitor/state.json')); age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(s['checked_at'])).total_seconds(); assert -30 <= age < 180"]
      interval: 60s
      timeout: 5s
      retries: 2
      start_period: 60s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  oa_pgdata:
  oa_files:
